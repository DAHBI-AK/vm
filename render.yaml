services:
  - type: web
    name: vm-mobile
    runtime: node
    plan: free
    region: frankfurt
    branch: vm-quality-favorites
    autoDeploy: true
    buildCommand: npm install --omit=dev --ignore-scripts && node scripts/ensure-ytdlp.js
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VM_CLOUD
        value: "1"
