<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VM Guide</title>
  <style>
    body { margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:#0b1220; color:#f5f7fb; padding:24px 16px; }
    .wrap { max-width:980px; margin:0 auto; }
    h1 { margin:0 0 8px; }
    .sub { color:#9aa8bc; margin-bottom:14px; }
    .box { background:#162033; border:1px solid #2b3b55; border-radius:14px; padding:14px; margin-bottom:14px; line-height:1.7; }
    code { background:#0b1220; padding:2px 6px; border-radius:6px; direction:ltr; display:inline-block; }
    .card { background:#162033; border:1px solid #2b3b55; border-radius:16px; padding:12px; }
    .card img { width:100%; display:block; border-radius:12px; margin-top:10px; border:1px solid #2b3b55; }
    .card img:first-child { margin-top:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>VM — Image Guide</h1>
    <p class="sub">Images in order: 1 → 2 → 3</p>

    <div class="box">
      <strong>Run these files from Explorer (not from the browser):</strong><br />
      1) <code>INSTALL_TOOLS.bat</code><br />
      2) <code>CREATE_DESKTOP_SHORTCUT.bat</code><br />
      3) <code>VM.exe</code><br />
      Menu: <code>RUN_MENU.bat</code>
    </div>

    <div class="card">
      <img src="guide-images/1-what-vm-does.png" alt="1 What VM does" />
      <img src="guide-images/2-how-vm-works.png" alt="2 How VM works" />
      <img src="guide-images/3-install-steps.png" alt="3 Install steps" />
    </div>
  </div>
</body>
</html>
